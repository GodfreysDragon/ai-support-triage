name: keep-alive

# Render's free plan sleeps after 15 minutes without traffic, and the next
# visitor waits about a minute for it to wake. Pinging the health check every
# 10 minutes keeps the demo awake (one always-on service fits within Render's
# 750 free hours a month). A failed run means the demo is down; GitHub emails
# whoever last edited this schedule.
#
# Caveats: GitHub can delay scheduled runs at busy times, and it disables
# schedules after 60 days without repository activity (re-enable on the
# Actions tab).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    # Forks don't need to ping this demo.
    if: github.repository == 'GodfreysDragon/ai-support-triage'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Ping the live demo
        env:
          URL: https://ai-support-triage-pyox.onrender.com/up
        run: |
          # A sleeping service can take about a minute to answer, so allow
          # a long timeout and a few retries before calling it down.
          curl -fsS -o /dev/null --max-time 120 --retry 3 --retry-delay 15 --retry-all-errors \
            -w "HTTP %{http_code} in %{time_total}s\n" "$URL"
