; The built-in server is the CLI SAPI, so OPcache must be enabled for CLI.
opcache.enable_cli=1
opcache.validate_timestamps=0
memory_limit=256M
; Unbuffered output, so server-sent events reach the browser as they're sent.
output_buffering=0
display_errors=Off
log_errors=On
error_log=/dev/stderr
expose_php=Off
